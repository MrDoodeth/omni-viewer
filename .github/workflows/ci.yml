name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '26'
          cache: maven
      - name: Run Java tests (Linux)
        if: runner.os == 'Linux'
        run: |
          for attempt in 1 2 3; do
            ./mvnw -B -ntp verify && exit 0
            if [ "$attempt" -lt 3 ]; then
              echo "Maven Wrapper failed (attempt $attempt); retrying in $((attempt * 5)) seconds..."
              sleep $((attempt * 5))
            fi
          done
          exit 1
      - name: Run Java tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            ./mvnw.cmd -B -ntp verify
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -lt 3) {
              Write-Host "Maven Wrapper failed (attempt $attempt); retrying..."
              Start-Sleep -Seconds (5 * $attempt)
            }
          }
          exit 1

  package:
    name: Package (${{ matrix.os }})
    needs: test
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '26'
          cache: maven
      - name: Build application and collect dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          for attempt in 1 2 3; do
            ./mvnw -B -ntp -Pportable -DskipTests package && exit 0
            if [ "$attempt" -lt 3 ]; then
              echo "Maven Wrapper/package failed (attempt $attempt); retrying in $((attempt * 5)) seconds..."
              sleep $((attempt * 5))
            fi
          done
          exit 1
      - name: Build application and collect dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            ./mvnw.cmd -B -ntp -Pportable -DskipTests package
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -lt 3) {
              Write-Host "Maven Wrapper/package failed (attempt $attempt); retrying..."
              Start-Sleep -Seconds (5 * $attempt)
            }
          }
          exit 1
      - uses: actions/upload-artifact@v7
        with:
          name: omni-viewer-${{ matrix.os }}
          path: target/dist/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release
    needs: package
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Publish both artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/OmniViewer-linux-x86_64.AppImage dist/OmniViewer-windows-x64.exe --verify-tag --generate-notes
